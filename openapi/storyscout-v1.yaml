openapi: 3.1.0
info:
  title: StoryScout Recording and Book Reader API
  version: 1.2.0
  description: GUID-gated, direct-to-S3 browser recording ingestion. Processing and delivery are separate modules.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
security: []
paths:
  /books/{bookId}:
    get:
      summary: Read a book title and ordered chapter summaries
      description: Public read-only access by book ID. Resolves books/{bookId}/book.json in the configured bucket; no recording session required.
      operationId: getBook
      parameters:
        - $ref: '#/components/parameters/BookId'
      responses:
        '200':
          description: Ordered book contents
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /books/{bookId}/chapters/{chapterId}:
    get:
      summary: Read original-language refined text or English translation
      operationId: getBookChapter
      parameters:
        - $ref: '#/components/parameters/BookId'
        - $ref: '#/components/parameters/ChapterId'
        - name: version
          in: query
          schema: { type: string, enum: [original, english], default: original }
      responses:
        '200':
          description: Chapter text and optional signed image URLs; English originals use the original text in either view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookChapterText' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /books/{bookId}/chapters/{chapterId}/audio:
    get:
      summary: Obtain a temporary original-recording URL
      description: Checks the manifest-referenced object exists and signs it for up to one hour. Refetch after expiry or media access failure. Credential expiry can shorten URL lifetime. Responses are not cached.
      operationId: getBookChapterAudio
      parameters:
        - $ref: '#/components/parameters/BookId'
        - $ref: '#/components/parameters/ChapterId'
      responses:
        '200':
          description: Signed audio link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookMediaLink' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /health:
    get:
      summary: Check process health
      operationId: getHealth
      responses:
        '200':
          {
            description: Process is healthy,
            content: { application/json: { schema: { $ref: '#/components/schemas/Status' } } },
          }
        '404': { $ref: '#/components/responses/Error' }
  /ready:
    get:
      summary: Check S3 readiness
      operationId: getReadiness
      responses:
        '200':
          {
            description: S3 is reachable,
            content: { application/json: { schema: { $ref: '#/components/schemas/Status' } } },
          }
        '503': { description: S3 is not reachable }
        '404': { $ref: '#/components/responses/Error' }
  /access-sessions:
    post:
      summary: Validate a participant access code
      operationId: createAccessSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guid]
              properties: { guid: { type: string, format: uuid } }
      responses:
        '201':
          description: Temporary access granted
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, displayName, expiresAt]
                properties:
                  accessToken: { type: string }
                  displayName: { type: string }
                  expiresAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Error' }
  /recordings:
    post:
      summary: Create a direct S3 recording upload
      operationId: createRecordingUpload
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [originalFilename, contentType, sizeBytes]
              properties:
                originalFilename: { type: string }
                contentType: { $ref: '#/components/schemas/AudioContentType' }
                sizeBytes: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Recording created with scoped S3 upload instructions
          content:
            application/json:
              schema:
                type: object
                required: [recording, upload]
                properties:
                  recording: { $ref: '#/components/schemas/Recording' }
                  upload:
                    type: object
                    required: [url, method, headers, expiresAt]
                    properties:
                      url: { type: string, format: uri }
                      method: { type: string, const: PUT }
                      headers: { type: object, additionalProperties: { type: string } }
                      expiresAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /recordings/{recordingId}:
    parameters: [{ $ref: '#/components/parameters/RecordingId' }]
    get:
      summary: Get recording ingestion status
      operationId: getRecording
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          {
            description: Recording ingestion status,
            content: { application/json: { schema: { $ref: '#/components/schemas/Recording' } } },
          }
        '404': { $ref: '#/components/responses/Error' }
  /recordings/{recordingId}/complete:
    parameters: [{ $ref: '#/components/parameters/RecordingId' }]
    post:
      summary: Verify and complete a recording upload
      operationId: completeRecordingUpload
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          {
            description: S3 upload verified,
            content: { application/json: { schema: { $ref: '#/components/schemas/Recording' } } },
          }
        '409': { $ref: '#/components/responses/Error' }
  /recordings/{recordingId}/transcription:
    parameters: [{ $ref: '#/components/parameters/RecordingId' }]
    get:
      summary: Get the completed transcription for a recording
      operationId: getRecordingTranscription
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Recording metadata and transcription text
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordingTranscription' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    BookId:
      name: bookId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChapterId:
      name: chapterId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-zA-Z0-9_-]{1,100}$' }
    RecordingId:
      name: recordingId
      in: path
      required: true
      schema: { type: string, pattern: '^recording_[A-Za-z0-9_-]+$' }
  schemas:
    BookMediaLink:
      type: object
      required: [url, expiresAt]
      properties:
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    BookChapterSummary:
      type: object
      required:
        [
          id,
          number,
          sourceLanguage,
          summary,
          originalSummary,
          hasAudio,
          hasRefinedStory,
          hasEnglishTranslation,
        ]
      properties:
        id: { type: string }
        number: { type: integer, minimum: 1 }
        sourceLanguage: { type: string }
        summary: { type: [string, 'null'] }
        originalSummary: { type: [string, 'null'] }
        hasAudio: { type: boolean }
        hasRefinedStory: { type: boolean }
        hasEnglishTranslation: { type: boolean }
    Book:
      type: object
      required: [id, title, chapters]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        chapters:
          type: array
          items: { $ref: '#/components/schemas/BookChapterSummary' }
    BookChapterText:
      type: object
      required:
        [
          bookId,
          bookTitle,
          id,
          number,
          sourceLanguage,
          language,
          version,
          text,
          images,
          hasEnglishTranslation,
          hasRefinedStory,
        ]
      properties:
        bookId: { type: string, format: uuid }
        bookTitle: { type: string }
        id: { type: string }
        number: { type: integer, minimum: 1 }
        sourceLanguage: { type: string }
        language: { type: string }
        version: { type: string, enum: [original, english] }
        text: { type: string }
        hasEnglishTranslation: { type: boolean }
        hasRefinedStory: { type: boolean }
        images:
          type: array
          items:
            type: object
            required: [url, expiresAt, alt]
            properties:
              url: { type: string, format: uri }
              expiresAt: { type: string, format: date-time }
              alt: { type: string }
              caption: { type: string }
    Status:
      type: object
      required: [status]
      properties: { status: { type: string } }
    AudioContentType:
      type: string
      enum: [audio/mp4, audio/mpeg, audio/wav, audio/x-wav, audio/webm]
    Recording:
      type: object
      required:
        [recordingId, participantName, createdAt, storageState, originalFilename, contentType]
      properties:
        recordingId: { type: string }
        participantName: { type: string }
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        storageState: { type: string, enum: [awaitingUpload, ready] }
        originalFilename: { type: string }
        contentType: { $ref: '#/components/schemas/AudioContentType' }
        sizeBytes: { type: [integer, 'null'] }
    RecordingTranscription:
      type: object
      required: [recording, transcription]
      properties:
        recording: { $ref: '#/components/schemas/Recording' }
        transcription:
          type: object
          required: [text]
          properties:
            text: { type: string }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
  responses:
    Error:
      description: Request rejected
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
